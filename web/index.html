<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_project">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_project</title>
  <link rel="manifest" href="manifest.json">

  <!--
    加载动画：纯 CSS，HTML 解析即显示，无需等待 main.dart.js，避免白屏。
    Flutter 首帧渲染完成后，由 lib/main.dart 淡出并移除 #app-loader。
  -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f8fa;
      font-family: -apple-system, BlinkMacSystemFont,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: opacity .3s ease;
    }

    #app-loader.fade-out {
      opacity: 0;
    }

    /* 入场：弹簧式放大回弹 */
    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: loader-in .7s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    @keyframes loader-in {
      from { opacity: 0; transform: scale(.82); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* 双环：外环 conic 渐变快转 + 内环细环慢转 */
    .loader-rings {
      position: relative;
      width: 88px;
      height: 88px;
    }

    .loader-rings::before,
    .loader-rings::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    /* 外环：微信绿 → 银灰渐变，顺时针旋转 + 辉光 */
    .loader-rings::before {
      inset: 0;
      background: conic-gradient(from 0deg, #07C160, #d9dfe6 45%, #07C160);
      -webkit-mask: radial-gradient(farthest-side,
          transparent calc(100% - 6px), #000 calc(100% - 6px));
      mask: radial-gradient(farthest-side,
          transparent calc(100% - 6px), #000 calc(100% - 6px));
      animation: spin-clock 1.1s linear infinite;
      filter: drop-shadow(0 0 14px rgba(7, 193, 96, .45));
    }

    /* 内环：细边框圆环，逆时针慢转，形成轨道视差 + 辉光 */
    .loader-rings::after {
      inset: 16px;
      border: 3px solid transparent;
      border-top-color: #07C160;
      border-right-color: rgba(7, 193, 96, .35);
      filter: drop-shadow(0 0 8px rgba(7, 193, 96, .35));
      animation: spin-counter 1.8s linear infinite;
    }

    @keyframes spin-clock {
      to { transform: rotate(360deg); }
    }

    @keyframes spin-counter {
      to { transform: rotate(-360deg); }
    }

    /* 文字：流光扫描 + 跳动小点 */
    .loader-label {
      position: relative;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 2px;
      color: rgba(0, 0, 0, .55);
      white-space: nowrap;
    }

    .loader-shine {
      position: absolute;
      left: 0;
      top: 0;
      background: linear-gradient(100deg,
          transparent 0%, rgba(7, 193, 96, .35) 45%,
          #07C160 50%, rgba(7, 193, 96, .35) 55%, transparent 100%);
      background-size: 240% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 1.8s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: -240% 0; }
    }

    .loader-dots {
      display: inline-flex;
      gap: 5px;
      margin-left: 6px;
    }

    .loader-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #07C160;
      animation: dot-bounce .9s ease-in-out infinite;
    }

    .loader-dots span:nth-child(2) { animation-delay: .15s; }
    .loader-dots span:nth-child(3) { animation-delay: .3s; }

    @keyframes dot-bounce {
      0%, 100% { opacity: .25; transform: translateY(0); }
      50%      { opacity: 1;   transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <div id="app-loader">
    <div class="loader-wrapper">
      <div class="loader-rings"></div>
      <div class="loader-label">
        <span>加载中</span>
        <span class="loader-shine"><span>加载中</span></span>
        <span class="loader-dots"><span></span><span></span><span></span></span>
      </div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
